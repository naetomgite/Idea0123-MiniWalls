name: Release wallpaper collection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Archive and release wallpapers
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Create wallpaper archive
        run: |
          cd docs/wallpapers
          zip -r ../../MiniWalls-wallpapers.zip .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: wallpapers-${{ github.run_number }}
        run: >-
          gh release create "$RELEASE_TAG" MiniWalls-wallpapers.zip
          --target "$GITHUB_SHA"
          --title "Wallpaper collection #${{ github.run_number }}"
          --generate-notes

      - name: Remove previous releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: wallpapers-${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail

          while read -r release_id; do
            [ -n "$release_id" ] || continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          done < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name != \"${RELEASE_TAG}\") | .id"
          )
