name: Render horizontal cards

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-horizontal-cards.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer
        run: python -m pip install --disable-pip-version-check cairosvg pillow

      - name: Render horizontal PNG cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          from PIL import Image

          source = Path('docs/assets/idea0123-h-card-1920x1080.svg')
          outputs = [
              (1920, 1080),
              (3840, 2160),
              (7680, 4320),
          ]

          for width, height in outputs:
              target = Path(f'docs/assets/idea0123-h-card-{width}x{height}.png')
              cairosvg.svg2png(
                  url=str(source),
                  write_to=str(target),
                  output_width=width,
                  output_height=height,
              )
              image = Image.open(target).convert('RGB')
              image.save(target, optimize=True, compress_level=9)
              print(f'Rendered {target}: {image.size}')
          PY

      - name: Commit rendered PNG cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/idea0123-h-card-1920x1080.png \
                  docs/assets/idea0123-h-card-3840x2160.png \
                  docs/assets/idea0123-h-card-7680x4320.png
          if git diff --cached --quiet; then
            echo "Rendered PNG files are already up to date."
            exit 0
          fi
          git commit -m "Render horizontal promo PNGs"
          git push origin HEAD:main
